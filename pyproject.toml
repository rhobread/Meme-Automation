[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meme-automation"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "redis>=5.2,<7",
  "celery[redis]>=5.4,<6", "pydantic-settings>=2.7,<3", "cryptography>=44,<47",
  "httpx>=0.28,<1", "Pillow>=11,<13", "python-multipart>=0.0.20,<1",
  "openai>=2.0,<3", "defusedxml>=0.7.1,<1"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
